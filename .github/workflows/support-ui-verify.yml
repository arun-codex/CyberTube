name: Chai support UI verification

on:
  push:
    branches:
      - feat/cybertube-inline-chai-support-theme-safe
  pull_request:
    paths:
      - 'src/components/support/**'
      - 'src/components/Footer.tsx'
      - 'src/components/Header.tsx'
      - 'app/page.tsx'
      - 'test/support-layout.test.ts'
      - 'tests/35_support_placement_and_theme.spec.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Support placement and payment safety tests
        run: npm run test:support
      - name: Build application
        run: npm run build
