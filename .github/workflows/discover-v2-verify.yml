name: Discover v2 verification

on:
  push:
    branches:
      - feat/discover-personalized-feed-cloud-history-2026
  pull_request:
    paths:
      - 'app/discover/**'
      - 'app/api/discover/**'
      - 'src/lib/discovery/**'
      - 'src/components/discovery/**'
      - 'app/profile/**'
      - 'supabase/migrations/20261120150000_discover_video_history.sql'
      - 'package.json'

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
