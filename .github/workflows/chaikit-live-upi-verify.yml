name: Direct UPI Support Activation Verification

on:
  push:
    branches: [feat/activate-direct-upi-chaikit-20261121]
  pull_request:
    paths:
      - 'app/api/support/**'
      - 'app/support/**'
      - 'src/components/support/**'
      - 'src/lib/chaikit/**'
      - 'src/components/Footer.tsx'
      - 'test/*chaikit*'
      - 'test/support-layout.test.ts'
      - 'tests/3*_support*'
      - 'tests/39_chaikit_live_direct_upi.spec.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify vendored ChaiKit integrity, inline support, and activation safety gates
        run: npm run test:chaikit && npm run test:chaikit-live && npm run test:support
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test live and demo UPI handoff UI without making a real transfer
        run: npx playwright test tests/35_support_placement_and_theme.spec.ts tests/36_support_page_chaikit.spec.ts tests/39_chaikit_live_direct_upi.spec.ts --project=chromium
